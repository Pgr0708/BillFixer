# Temporary HTTP-only config used once to obtain the TLS certificate.
server {
    listen 80;
    listen [::]:80;
    server_name billfixer.dakshyaminfotech.store;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 200 "BillFixer API — TLS setup in progress\n"; add_header Content-Type text/plain; }
}
