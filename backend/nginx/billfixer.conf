# ═══════════════════════════════════════════════════════════════════════════
#  BillFixer API — nginx reverse proxy
#  Install: /etc/nginx/sites-available/billfixer.conf  (+ symlink into sites-enabled)
#  Snippet: /etc/nginx/snippets/billfixer-proxy.conf
# ═══════════════════════════════════════════════════════════════════════════

# Edge rate limiting (first line of defence; the API applies finer per-user limits).
limit_req_zone  $binary_remote_addr zone=bf_api:10m  rate=20r/s;
limit_req_zone  $binary_remote_addr zone=bf_auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=bf_conn:10m;
limit_req_status 429;
limit_conn_status 429;

upstream billfixer_api {
    least_conn;
    server 127.0.0.1:3000 max_fails=3 fail_timeout=15s;
    # Horizontal scaling — add more app servers (same code, same .env, shared MySQL/Redis):
    # server 10.0.0.12:3000 max_fails=3 fail_timeout=15s;
    # server 10.0.0.13:3000 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name billfixer.dakshyaminfotech.store;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx ≥ 1.25.1. On older nginx delete this line and use: listen 443 ssl http2;
    server_name billfixer.dakshyaminfotech.store;

    ssl_certificate     /etc/letsencrypt/live/billfixer.dakshyaminfotech.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/billfixer.dakshyaminfotech.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:BFSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 60s;
    limit_conn bf_conn 40;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    access_log /var/log/nginx/billfixer.access.log;
    error_log  /var/log/nginx/billfixer.error.log warn;

    location = /health/live {
        access_log off;
        proxy_pass http://billfixer_api;
        include snippets/billfixer-proxy.conf;
    }
    location = /health/ready {
        access_log off;
        proxy_pass http://billfixer_api;
        include snippets/billfixer-proxy.conf;
    }
    location /v1/auth/ {
        limit_req zone=bf_auth burst=10 nodelay;
        proxy_pass http://billfixer_api;
        include snippets/billfixer-proxy.conf;
    }
    location /v1/webhooks/ {
        proxy_pass http://billfixer_api;
        include snippets/billfixer-proxy.conf;
    }
    location /v1/ {
        limit_req zone=bf_api burst=40 nodelay;
        proxy_pass http://billfixer_api;
        include snippets/billfixer-proxy.conf;
    }
    location / {
        return 404;
    }
}
