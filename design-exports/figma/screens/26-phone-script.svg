9.5 5.6 9.8 6.5 C10.1 7.2 9.9 8.1 9.3 8.6 L8.1 9.9 C9.6 12.5 11.5 14.4 14.1 15.9 L15.4 14.6 C15.9 14 16.8 13.8 17.5 14.1 C18.4 14.4 19.3 14.7 20.3 14.8 C21.3 14.9 22 15.8 22 16.9 Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text id="Call provider" x="106" y="144" font-family="Plus Jakarta Sans" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start" letter-spacing="-0.3">Riverside Billing Dept</text><text id="Call number" x="106" y="166" font-family="JetBrains Mono" font-size="12" font-weight="500" fill="#9FC0F0" text-anchor="start">(555) 019-4400 · Mon–Fri 8–5</text><ellipse id="Call button" cx="330" cy="150" rx="19" ry="19" fill="#22C07A"/><g id="Call button icon" transform="translate(322,142) scale(0.6667)"><path d="M22 16.9 L22 19.9 C22 21.1 21 22 19.8 21.9 C16.7 21.6 13.8 20.5 11.2 18.9 C8.8 17.4 6.8 15.4 5.2 12.9 C3.6 10.3 2.5 7.3 2.2 4.1 C2.1 3 3 2 4.1 2 L7.1 2 C8.1 2 9 2.7 9.1 3.7 C9.2 4.7 9.5 5.6 9.8 6.5 C10.1 7.2 9.9 8.1 9.3 8.6 L8.1 9.9 C9.6 12.5 11.5 14.4 14.1 15.9 L15.4 14.6 C15.9 14 16.8 13.8 17.5 14.1 C18.4 14.4 19.3 14.7 20.3 14.8 C21.3 14.9 22 15.8 22 16.9 Z" fill="#FFFFFF"/></g><text id="Step label" x="24" y="224" font-family="Plus Jakarta Sans" font-size="9.5" font-weight="800" fill="#8492AB" text-anchor="start" letter-spacing="1.8">STEP 1 · OPENING</text><rect id="Card Script" x="24" y="238" width="342" height="158" rx="18" fill="#FFFFFF" filter="url(#shCard)"/><rect id="Script tab" x="44" y="236" width="36" height="4" rx="2" fill="url(#gradTeal)"/><g id="Script body"><text id="Script body line 1" x="44" y="278" font-family="Lora" font-size="14.5" font-weight="400" fill="#14213D" text-anchor="start">“Hi, my name is Alex Johnson, account</text><text id="Script body line 2" x="44" y="304" font-family="Lora" font-size="14.5" font-weight="400" fill="#14213D" text-anchor="start">4471-A. I&#x27;ve compared my statement to my</text><text id="Script body line 3" x="44" y="330" font-family="Lora" font-size="14.5" font-weight="400" fill="#14213D" text-anchor="start">Explanation of Benefits and I&#x27;m seeing two</text><text id="Script body line 4" x="44" y="356" font-family="Lora" font-size="14.5" font-weight="400" fill="#14213D" text-anchor="start">discrepancies. Can you pull up the itemized</text><text id="Script body line 5" x="44" y="382" font-family="Lora" font-size="14.5" font-weight="400" fill="#14213D" text-anchor="start">detail with me?”</text></g><rect id="Script divider" x="44" y="356" width="302" height="1" fill="#E9EEF6"/><rect id="Tone Calm bg" x="44" y="366" width="48" height="22" rx="11" fill="#E2F9F5"/><text id="Tone Calm label" x="54" y="381" font-family="Plus Jakarta Sans" font-size="10.5" font-weight="700" fill="#0E8C78" text-anchor="start">Calm</text><rect id="Tone Specific bg" x="130" y="366" width="76" height="22" rx="11" fill="#E8F1FE"/><text id="Tone Specific label" x="140" y="381" font-family="Plus Jakarta Sans" font-size="10.5" font-weight="700" fill="#1E5FC4" text-anchor="start">Specific</text><rect id="Tone No accusation bg" x="286" y="366" width="111" height="22" rx="11" fill="#EEF1F6"/><text id="Tone No accusation label" x="296" y="381" font-family="Plus Jakarta Sans" font-size="10.5" font-weight="700" fill="#4A5A75" text-anchor="start">No accusation</text><text id="Branch label" x="24" y="428" font-family="Plus Jakarta Sans" font-size="9.5" font-weight="800" fill="#8492AB" text-anchor="start" letter-spacing="1.8">WHAT DID THEY SAY?</text><rect id="Branch A" x="24" y="444" width="342" height="60" rx="16" fill="#FFFFFF" filter="url(#shCard)"/><rect id="Branch A key bg" x="42" y="460" width="28" height="28" rx="9" fill="#E2F9F5"/><text id="Branch A key" x="56" y="479" font-family="Plus Jakarta Sans" font-size="12" font-weight="800" fill="#0E8C78" text-anchor="middle">A</text><text id="Branch A label" x="82" y="480" font-family="Plus Jakarta Sans" font-size="13.5" font-weight="600" fill="#14213D" text-anchor="start">“The bill is correct as issued.”</text><g id="Branch A chev" transform="translate(334,465) scale(0.7500)"><path d="M9 6 L15 12 L9 18" fill="none" stroke="#B4BECE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><rect id="Branch B" x="24" y="516" width="342" height="60" rx="16" fill="#FFFFFF" filter="url(#shCard)"/><rect id="Branch B key bg" x="42" y="532" width="28" height="28" rx="9" fill="#FFF5E2"/><text id="Branch B key" x="56" y="551" font-family="Plus Jakarta Sans" font-size="12" font-weight="800" fill="#B5730A" text-anchor="middle">B</text><text id="Branch B label" x="82" y="552" font-family="Plus Jakarta Sans" font-size="13.5" font-weight="600" fill="#14213D" text-anchor="start">“I can&#x27;t adjust that — it&#x27;s final.”</text><g id="Branch B chev" transform="translate(334,537) scale(0.7500)"><path d="M9 6 L15 12 L9 18" fill="none" stroke="#B4BECE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><rect id="Branch C" x="24" y="588" width="342" height="60" rx="16" fill="#FFFFFF" filter="url(#shCard)"/><rect id="Branch C key bg" x="42" y="604" width="28" height="28" rx="9" fill="#E6F9EF"/><text id="Branch C key" x="56" y="623" font-family="Plus Jakarta Sans" font-size="12" font-weight="800" fill="#146245" text-anchor="middle">C</text><text id="Branch C label" x="82" y="624" font-family="Plus Jakarta Sans" font-size="13.5" font-weight="600" fill="#14213D" text-anchor="start">“Let me review and call you back.”</text><g id="Branch C chev" transform="translate(334,609) scale(0.7500)"><path d="M9 6 L15 12 L9 18" fill="none" stroke="#B4BECE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><rect id="Branch D" x="24" y="660" width="342" height="60" rx="16" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5" filter="url(#shCard)"/><rect id="Branch D key bg" x="42" y="676" width="28" height="28" rx="9" fill="#FEF0F0"/><text id="Branch D key" x="56" y="695" font-family="Plus Jakarta Sans" font-size="12" font-weight="800" fill="#8F2020" text-anchor="middle">D</text><text id="Branch D label" x="82" y="696" font-family="Plus Jakarta Sans" font-size="13.5" font-weight="600" fill="#14213D" text-anchor="start">“This is going to collections.”</text><g id="Branch D chev" transform="translate(334,681) scale(0.7500)"><path d="M9 6 L15 12 L9 18" fill="none" stroke="#B4BECE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
