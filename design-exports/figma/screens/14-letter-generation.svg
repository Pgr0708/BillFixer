mily="JetBrains Mono" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text id="Step 2 label" x="172" y="128" font-family="Plus Jakarta Sans" font-size="11.5" font-weight="700" fill="#8492AB" text-anchor="start">Review</text><rect id="Step 3 bg" x="252" y="106" width="102" height="34" rx="10" fill="#EDF1F7"/><ellipse id="Step 3 disc" cx="270" cy="123" rx="9" ry="9" fill="#C8D3E2"/><text id="Step 3 num" x="270" y="127" font-family="JetBrains Mono" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text id="Step 3 label" x="286" y="128" font-family="Plus Jakarta Sans" font-size="11.5" font-weight="700" fill="#8492AB" text-anchor="start">Send</text><text id="Letter kind" x="195" y="172" font-family="Plus Jakarta Sans" font-size="15" font-weight="800" fill="#14213D" text-anchor="middle" letter-spacing="-0.3">EOB Mismatch Dispute Letter</text><text id="Letter sub" x="195" y="192" font-family="DM Sans" font-size="12" font-weight="400" fill="#8492AB" text-anchor="middle">Pre-filled with your details</text><rect id="Letter paper" x="24" y="210" width="342" height="430" rx="10" fill="#FEFDFA" stroke="#EDE8DC" stroke-width="1" filter="url(#shCard)"/><text id="Letter date" x="44" y="246" font-family="Lora" font-size="12.5" font-weight="400" fill="#4A5A75" text-anchor="start">March 20, 2024</text><g id="Letter address"><text id="Letter address line 1" x="44" y="282" font-family="Lora" font-size="12.5" font-weight="400" fill="#4A5A75" text-anchor="start">Billing Department</text><text id="Letter address line 2" x="44" y="302" font-family="Lora" font-size="12.5" font-weight="400" fill="#4A5A75" text-anchor="start">Riverside Medical Center</text><text id="Letter address line 3" x="44" y="322" font-family="Lora" font-size="12.5" font-weight="400" fill="#4A5A75" text-anchor="start">123 Health Way</text><text id="Letter address line 4" x="44" y="342" font-family="Lora" font-size="12.5" font-weight="400" fill="#4A5A75" text-ancho