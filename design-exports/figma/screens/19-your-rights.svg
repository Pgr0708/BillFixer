"12.5" font-weight="400" fill="#1E4C8A" text-anchor="start">bill was generated. We flag what to check.</text></g><rect id="Right 1" x="24" y="204" width="342" height="116" rx="18" fill="#FFFFFF" filter="url(#shCard)"/><rect id="Right 1 tile" x="42" y="226" width="46" height="46" rx="14" fill="#E8F1FE"/><g id="Right 1 icon" transform="translate(53,237) scale(1.0000)"><path d="M12 2 L20 6 L20 12 C20 17 16.6 20.8 12 22 C7.4 20.8 4 17 4 12 L4 6 Z M8.5 12 L11 14.5 L16 9" fill="none" stroke="#2E7DF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text id="Right 1 title" x="102" y="246" font-family="Plus Jakarta Sans" font-size="15" font-weight="800" fill="#14213D" text-anchor="start" letter-spacing="-0.3">No Surprises Act</text><rect id="Right 1 tag bg" x="284.8" y="230" width="63.2" height="22" rx="11" fill="#E8F1FE"/><text id="Right 1 tag" x="338" y="245" font-family="Plus Jakarta Sans" font-size="10.5" font-weight="700" fill="#2E7DF6" text-anchor="end">Likely</text><text id="Right 1 line 1" x="102" y="270" font-family="DM Sans" font-size="12.5" font-weight="400" fill="#4A5A75" text-anchor="start">Out-of-network charges may be</text><text id="Right 1 line 2" x="102" y="288" font-family="DM Sans" font-size="12.5" font-weight="400" fill="#4A5A75" text-anchor="start">protected under federal law.</text><g id="Right 1 chev" transform="translate(336,284) scale(0.7500)"><path d="M9 6 L15 12 L9 18" fill="none" stroke="#B4BECE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><rect id="Right 2" x="24" y="336" width="342" height="116" rx="18" fill="#FFFFFF" filter="url(#shCard)"/><rect id="Right 2 tile" x="42" y="358" width="46" height="46" rx="14" fill="#FEF0F0"/><g id="Right 2 icon" transform="translate(53,369) scale(1.0000)"><path d="M12 22 C6.5 22 2 17.5 2 12 C2 6.5 6.5 2 12 2 C17.5 2 22 6.5 22 12 C22 17.5 17.5 22 12 22 Z M9.1 9 C9.6 7.6 11 6.8 12.4 7 C13.9 7.3 15 8.6 15 10.1 C15 12 12 13 12 13 M12 17 L12.01 17" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text id="Right 2 title" x="102" y="378" font-family="Plus Jakarta Sans" font-size="15" font-weight="800" fill="#14213D" text-anchor="start" letter-spacing="-0.3">Financial Assistance</text><rect id="Right 2 tag bg" x="292.0" y="362" width="56.0" height="22" rx="11" fill="#FEF0F0"/><text id="Right 2 tag" x="338" y="377" font-family="Plus Jakarta Sans" font-size="10.5" font-weight="700" fill="#EF4444" text-anchor="end">Check</text><text id="Right 2 line 1" x="102" y="402" font-family="DM Sans" font-size="12.5" font-weight="400" fill="#4A5A75" text-anchor="start">You may qualify based on your</text><text id="Right 2 line 2" x="102" y="420" font-family="DM Sans" font-size="12.5" font-weight="400" fill="#4A5A75" text-anchor="start">income and hospital type.</text><g id="Right 2 chev" transform="translate(336,416) scale(0.7500)"><path d="M9 6 L15 12 L9 18" fill="none" stroke="#B4BECE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><rect id="Right 3" x="24" y="468" width="342" height="116" rx="18" fill="#FFFFFF" filter="url(#shCard)"/><rect id="Right 3 tile" x="42" y="490" width="46" height="46" rx="14" fill="#E2F9F5"/><g id="Right 3 icon" transform="translate(53,501) scale(1.0000)"><path d="M14 2 L6 2 C4.9 2 4 2.9 4 4 L4 20 C4 21.1 4.9 22 6 22 L18 22 C19.1 22 20 21.1 20 20 L20 8 Z M14 2 L14 8 L20 8" fill="none" stroke="#00BFA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text id="Right 3 title" x="102" y="510" font-family="Plus Jakarta Sans" font-size="15" font-weight="800" fill="#14213D" text-anchor="start" letter-spacing="-0.3">Request an Itemized Bill</text><rect id="Right 3 tag bg" x="284.8" y="494" width="63.2" height="22" rx="11" fill="#E2F9F5"/><text id="Right 3 tag" x="338" y="509" font-family="Plus Jakarta Sans" font-size="10.5" font-weight="700" fill="#00BFA5" text-anchor="end">Always</text><text id="Right 3 line 1" x="102" y="534" font-family="DM Sans" font-size="12.5" font-weight="400" fill="#4A5A75" text-anchor="start">You have the right to request a</text><text id="Right 3 line 2" x="102" y="552" font-family="DM Sans" font-size="12.5" font-weight="400" fill="#4A5A75" text-anchor="start">detailed, itemized bill.</text><g id="Right 3 chev" transform="translate(336,548) scale(0.7500)"><path d="M9 6 L15 12 L9 18" fill="none" stroke="#B4BECE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><rect id="Right 4" x="24" y="600" width="342" height="116" rx="18" fill="#FFFFFF" filter="url(#shCard)"/><rect id="Right 4 tile" x="42" y="622" width="46" height="46" rx="14" fill="#FFF5E2"/><g id="Right 4 icon" transform="translate(53,633) scale(1.0000)"><path d="M12 3 L12 21 M4 7 L20 7 M6 7 L3 14 L9 14 Z M18 7 L21 14 L15 14 Z" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text id="Right 4 title" x="102" y="642" font-family="Plus Jakarta Sans" font-size="15" font-weight="800" fill="#14213D" text-anchor="start" letter-spacing="-0.3">Compare with Your EOB</text><rect id="Right 4 tag bg" x="284.8" y="626" width="63.2" height="22" rx="11" fill="#FFF5E2"/><text id="Right 4 tag" x="338" y="641" font-family="Plus Jakarta Sans" font-size="10.5" font-weight="700" fill="#F5A623" text-anchor="end">Review</text><text id="Right 4 line 1" x="102" y="666" font-family="DM Sans" font-size="12.5" font-weight="400" fill="#4A5A75" text-anchor="start">Your bill should match your EOB</text><text id="Right 4 line 2" x="102" y="684" font-family="DM Sans" font-size="12.5" font-weight="400" fill="#4A5A75" text-anchor="start">patient responsibility.</text><g id="Right 4 chev" transform="translate(336,680) scale(0.7500)"><path d="M9 6 L15 12 L9 18" fill="none" stroke="#B4BECE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
