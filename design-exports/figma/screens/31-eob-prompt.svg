"190" width="24" height="4" rx="2" fill="#00BFA5" fill-opacity="0.5"/><rect id="Doc eob line 2" x="200" y="200" width="18" height="4" rx="2" fill="#CFEDE7"/><rect id="Doc eob line 3" x="200" y="210" width="22" height="4" rx="2" fill="#CFEDE7"/><g id="Link icon" transform="translate(178,246) scale(1.4167)"><path d="M12 3 L12 21 M4 7 L20 7 M6 7 L3 14 L9 14 Z M18 7 L21 14 L15 14 Z" fill="none" stroke="#F5A623" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text id="Title" x="195" y="320" font-family="Plus Jakarta Sans" font-size="26" font-weight="800" fill="#14213D" text-anchor="middle" letter-spacing="-1">Do you have an EOB?</text><g id="Subtitle"><text id="Subtitle line 1" x="195" y="354" font-family="DM Sans" font-size="14.5" font-weight="400" fill="#4A5A75" text-anchor="middle">An Explanation of Benefits from your insurer</text><text id="Subtitle line 2" x="195" y="378" font-family="DM Sans" font-size="14.5" font-weight="400" fill="#4A5A75" text-anchor="middle">unlocks our most accurate check — line-by-line</text><text id="Subtitle line 3" x="195" y="402" font-family="DM Sans" font-size="14.5" font-weight="400" fill="#4A5A75" text-anchor="middle">reconciliation against what was actually allowed.</text></g><rect id="Card Benefit" x="24" y="448" width="342" height="108" rx="18" fill="#E2F9F5"/><text id="Benefit label" x="42" y="476" font-family="Plus Jakarta Sans" font-size="9.5" font-weight="800" fill="#0E8C78" text-anchor="start" letter-spacing="1.6">WITH AN EOB WE CAN</text><ellipse id="Benefit 1 disc" cx="50" cy="502" rx="7" ry="7" fill="#00BFA5"/><path id="Benefit 1 check" d="M47 502 L49.2 504.2 L53.4 499.8" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text id="Benefit 1 label" x="68" y="506" font-family="DM Sans" font-size="12.5" font-weight="400" fill="#0B6157" text-anchor="start">Catch charges your plan never allowed</text><ellipse id="Benefit 2 disc" cx="50" cy="526" rx="7" ry="7" fill="#00BFA5"/><path id="Benefit 2 check" d="M47 526 L49.2 528.2 L53.4 523.8" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text id="Benefit 2 label" x="68" y="530" font-family="DM Sans" font-size="12.5" font-weight="400" fill="#0B6157" text-anchor="start">Verify your true patient responsibility</text><g id="Button Yes add EOB"><rect id="Button Yes add EOB bg" x="24" y="588" width="342" height="56" rx="18" fill="url(#gradTeal)"/><g id="Button Yes add EOB icon" transform="translate(100.12,606.0) scale(0.8333)"><path d="M12 5 L12 19 M5 12 L19 12" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text id="Button Yes add EOB label" x="207.0" y="622.0" font-family="Plus Jakarta Sans" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Yes — add my EOB</text></g><g id="Button Skip"><rect id="Button Skip bg" x="24" y="656" width="342" height="52" rx="18" fill="#FFFFFF" stroke="#E9EEF6" stroke-width="1.5"/><text id="Button Skip label" x="195.0" y="688.0" font-family="Plus Jakarta Sans" font-size="17" font-weight="700" fill="#4A5A75" text-anchor="middle">Skip for now</text></g><rect id="Card Reduced" x="24" y="726" width="342" height="66" rx="16" fill="#F4F6FA"/><g id="Reduced icon" transform="translate(42,746) scale(0.7500)"><path d="M12 22 C6.5 22 2 17.5 2 12 C2 6.5 6.5 2 12 2 C17.5 2 22 6.5 22 12 C22 17.5 17.5 22 12 22 Z M12 16 L12 12 M12 8 L12.01 8" fill="none" stroke="#8492AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g id="Reduced body"><text id="Reduced body line 1" x="70" y="752" font-family="DM Sans" font-size="11.5" font-weight="400" fill="#4A5A75" text-anchor="start">Without an EOB we still check math, duplicates</text><text id="Reduced body line 2" x="70" y="769" font-family="DM Sans" font-size="11.5" font-weight="400" fill="#4A5A75" text-anchor="start">and hospital prices — at lower confidence.</text></g></g>
</g>
