nt-weight="400" fill="#4A5A75" text-anchor="start">Anesthesiology, radiology and pathology at i</text><rect id="Cover 3" x="24" y="464" width="342" height="72" rx="16" fill="#FFFFFF" filter="url(#shCard)"/><ellipse id="Cover 3 disc" cx="50" cy="500" rx="11" ry="11" fill="#E8F1FE"/><text id="Cover 3 num" x="50" y="504" font-family="Plus Jakarta Sans" font-size="11" font-weight="800" fill="#2E7DF6" text-anchor="middle">3</text><text id="Cover 3 title" x="76" y="494" font-family="Plus Jakarta Sans" font-size="14" font-weight="800" fill="#14213D" text-anchor="start" letter-spacing="-0.2">Air ambulance</text><text id="Cover 3 body" x="76" y="514" font-family="DM Sans" font-size="11.5" font-weight="400" fill="#4A5A75" text-anchor="start">Out-of-network air ambulance is covered at i</text><rect id="Card Source" x="24" y="556" width="342" height="72" rx="16" fill="#F4F6FA"/><g id="Source icon" transform="translate(42,578) scale(0.8333)"><path d="M14 2 L6 2 C4.9 2 4 2.9 4 4 L4 20 C4 21.1 4.9 22 6 22 L18 22 C19.1 22 20 21.1 20 20 L20 8 Z M14 2 L14 8 L20 8" fill="none" stroke="#8492AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text id="Source label" x="72" y="582" font-family="Plus Jakarta Sans" font-size="9" font-weight="800" fill="#8492AB" text-anchor="start" letter-spacing="1.4">SOURCE</text><text id="Source ref" x="72" y="602" font-family="JetBrains Mono" font-size="12" font-weight="500" fill="#4A5A75" text-anchor="start">45 CFR §149.410 · Public Health Service Act</text><rect id="Card Caveat" x="24" y="644" width="342" height="76" rx="16" fill="#FFF5E2"/><g id="Caveat icon" transform="translate(42,664) scale(0.8333)"><path d="M12 22 C6.5 22 2 17.5 2 12 C2 6.5 6.5 2 12 2 C17.5 2 22 6.5 22 12 C22 17.5 17.5 22 12 22 Z M12 16 L12 12 M12 8 L12.01 8" fill="none" stroke="#B5730A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g id="Caveat body"><text id="Caveat body line 1" x="72" y="672" font-family="DM Sans" font-size="12" font-weight="400" fill="#7A5405" text-anchor="start">We flag what to check. Confirm with your plan —</text><text id="Caveat body line 2" x="72" y="691" font-family="DM Sans" font-size="12" font-weight="400" fill="#7A5405" text-anchor="start">Bill Fixer does not practice law.</text></g><g id="Button Generate NSA letter"><rect id="Button Generate NSA letter bg" x="24" y="740" width="342" height="56" rx="18" fill="url(#gradNavy)" filter="url(#shBtnNavy)"/><text id="Button Generate NSA letter label" x="195.0" y="774.0" font-family="Plus Jakarta Sans" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Generate NSA dispute letter</text></g></g>
